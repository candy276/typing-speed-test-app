name: Typing Speed Test CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Check HTML
        run: |
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<title>Typing Speed Test</title>" index.html

      - name: Check CSS
        run: |
          grep -q "body" style.css
          grep -q "#typing-input" style.css

      - name: Check JavaScript
        run: |
          grep -q "startTest" script.js
          grep -q "calculateStats" script.js

      - name: CI completed
        run: echo "All basic project checks passed successfully!"
